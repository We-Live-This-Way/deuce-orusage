# The container caps this process tree at 2 GB (cgroup memory.max). Gradle's JVM, the Kotlin
# compiler and every process-isolated dex worker have to fit inside that together, which is why
# the heap is small, the Kotlin compiler runs in-process, and workers are capped at one.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx384m
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
