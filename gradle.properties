# Heap sized from cgroup memory.max by vd3/size-gradle2.py: percentage-based, so it
# degrades with the cap instead of overcommitting if the cap is lowered. This box has
# memory.max=4 GiB and NO swap, so anon memory is the only hard wall.
# Regenerate after any memory limit change; do not hand-tune.
org.gradle.jvmargs=-XX:MaxRAMPercentage=35 -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-XX:MaxRAMPercentage=15
kotlin.compiler.execution.strategy=daemon
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
